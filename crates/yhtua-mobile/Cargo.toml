[package]
name = "yhtua-mobile"
description = "UniFFI bridge exposing Yhtua's crypto formats to the mobile native module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "lib"]
name = "yhtua_mobile"

[[bin]]
# Locked workspace bindgen — never a floating `cargo install`.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
yhtua-crypto = { path = "../yhtua-crypto" }
uniffi = { workspace = true, features = ["scaffolding-ffi-buffer-fns"] }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde = { workspace = true }
serde_json.workspace = true
base64.workspace = true
