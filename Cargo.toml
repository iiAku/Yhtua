[workspace]
resolver = "3"
members = ["src-tauri", "crates/yhtua-crypto"]
# The fuzz crate stays standalone: cargo-fuzz manages its own profiles and it
# path-depends into the workspace, which works from an excluded crate.
exclude = ["src-tauri/fuzz"]

[workspace.package]
version = "2.9.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
repository = "https://github.com/iiAku/Yhtua"
authors = ["Yoann Gendrey <yoann@gendrey.fr>"]

[workspace.dependencies]
ring = "0.17"
base64 = "0.23"
argon2 = { version = "0.6", features = ["zeroize"] }
zeroize = { version = "1.9", features = ["derive"] }
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Profiles are only honored in the workspace root manifest; keep them here.
[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
