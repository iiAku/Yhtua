[package]
name = "yhtua"
publish = false
version.workspace = true
description = "Open-source encrypted TOTP token manager for desktop"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://iiaku.github.io/Yhtua/"
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json.workspace = true
serde.workspace = true
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2.10.0"
tauri-plugin-dialog = "2.8.1"

# Crypto: format implementations live in the platform-neutral crate
yhtua-crypto = { path = "../crates/yhtua-crypto" }
base64.workspace = true
thiserror.workspace = true
dirs = "7"
whoami = "2.1"
tauri-plugin-clipboard-manager = "2.4.1"
zeroize.workspace = true
atomic-write-file = "0.3.1"

keyring = "4.2.0"
