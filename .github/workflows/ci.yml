name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and landing
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: bun audit
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build Nuxt application
        run: bun run build
      - name: Build Astro landing site
        run: bun run --cwd landing build
      - name: Check synchronized versions
        run: bun run check:version
      - name: Check local documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir . --exclude-path node_modules --exclude-path src-tauri/target --exclude-path src-tauri/fuzz/target './**/*.md'
          fail: true

  rust:
    name: Rust quality and security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Check compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - name: Lint with warnings denied
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test Rust code
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Install Rust security tools
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Check Rust policy
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

  platform-build:
    name: Package check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - name: macOS arm64
            os: macos-15
            bundles: dmg
            paths: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows x86_64
            os: windows-2025
            bundles: msi,nsis
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.93.1
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build native packages
        env:
          NO_STRIP: '1'
        run: bun run tauri build --bundles ${{ matrix.bundles }}
      - name: Patch AppImage Wayland compatibility
        if: runner.os == 'Linux'
        run: scripts/patch-appimage.sh
      - name: Smoke-test packaged AppImage UI
        if: runner.os == 'Linux'
        run: scripts/smoke-appimage.sh src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Upload package validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 3
