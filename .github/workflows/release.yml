name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Validate release tag and versions
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          bun run check:version
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          test "$REF_NAME" = "v$VERSION"
      - name: Install and audit locked dependencies
        run: bun install --frozen-lockfile && bun audit
      - name: Run frontend gate
        run: bun run check
      - name: Run Rust quality gate
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Install Rust security tools
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo install cargo-deny --version 0.20.2 --locked
      - name: Run Rust security gate
        run: cargo audit --file src-tauri/Cargo.lock && cargo deny --manifest-path src-tauri/Cargo.toml check
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - name: macos-arm64
            os: macos-15
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - name: windows-x86_64
            os: windows-2025
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.93.1
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        env:
          # linuxdeploy's bundled strip cannot read newer ELF RELR sections; Cargo already strips release debug info.
          NO_STRIP: '1'
        run: bun run tauri build
      - name: Upload platform packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: yhtua-${{ github.ref_name }}.cyclonedx.json
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
      - name: Flatten package artifacts
        run: |
          find release-assets -mindepth 2 -type f -print0 | while IFS= read -r -d '' asset; do
            name=$(basename "$asset")
            test ! -e "release-assets/$name"
            mv "$asset" "release-assets/$name"
          done
          find release-assets -mindepth 1 -type d -empty -delete
      - name: Add SBOM to release assets
        env:
          REF_NAME: ${{ github.ref_name }}
        run: mv "yhtua-${REF_NAME}.cyclonedx.json" release-assets/
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/*
      - name: Publish release after all artifacts exist
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=${REF_NAME#v}
          awk -v marker="## [$VERSION]" 'index($0, marker) == 1 {copy=1; next} /^## \[|^\[[^]]+\]:/{if(copy) exit} copy' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\n## Build record\n\n- Commit: `%s`\n- Workflow: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          printf '\n## Artifact signing\n\nThis release is not code-signed or notarized because signing credentials are not configured. Verify downloads with `SHA256SUMS` and the GitHub provenance attestations.\n' >> release-notes.md
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release edit "$REF_NAME" --draft --title "Yhtua $REF_NAME" --notes-file release-notes.md
          else
            gh release create "$REF_NAME" --verify-tag --draft --title "Yhtua $REF_NAME" --notes-file release-notes.md
          fi
          gh release upload "$REF_NAME" release-assets/* --clobber
          gh release edit "$REF_NAME" --draft=false --prerelease=false --latest

  pages:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build matching landing site
        run: bun run --cwd landing build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: landing/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
