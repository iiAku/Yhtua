name: Mobile bridge

# The AUTHORITATIVE gate for the Rust -> Swift bridge (plan phase 6a): if this
# job is green, the crypto crate cross-compiles for iOS, the UniFFI Swift
# bindings generate, real Swift code executes every golden vector through the
# Rust static library, and the XCFramework packages. EAS is only a packaging
# step behind this gate.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bridge/**'
      - 'scripts/build-ios-rust.sh'
      - 'test/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/mobile/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/mobile-bridge.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'bridge/**'
      - 'scripts/build-ios-rust.sh'
      - 'test/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/mobile/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/mobile-bridge.yml'

concurrency:
  group: bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Rust -> Swift golden gate
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
      - name: Test the FFI surface against the golden vectors
        run: cargo test -p yhtua-mobile --locked
      - name: Build the native static library for the runner
        run: cargo build -p yhtua-mobile --release --locked
      - name: Generate Swift bindings (locked workspace bindgen)
        run: |
          cargo run -p yhtua-mobile --features bindgen --bin uniffi-bindgen --locked -- \
            generate \
            --library target/release/libyhtua_mobile.a \
            --language swift \
            --out-dir bridge/generated
          cp bridge/generated/yhtua_mobileFFI.modulemap bridge/generated/module.modulemap
      - name: Run the golden vectors through Swift -> Rust
        run: |
          swiftc -O \
            bridge/ios/GoldenVectorRunner/main.swift \
            bridge/generated/yhtua_mobile.swift \
            -I bridge/generated \
            -L target/release -lyhtua_mobile \
            -o bridge/golden-vector-runner
          ./bridge/golden-vector-runner test/fixtures/crypto-vectors.json
      - name: Build the iOS XCFramework
        run: bash scripts/build-ios-rust.sh "$RUNNER_TEMP/yhtua-vault-ios"
      - name: Assert the XCFramework ships no headers (single module-map owner)
        run: |
          if find "$RUNNER_TEMP/yhtua-vault-ios/YhtuaMobile.xcframework" -name 'module.modulemap' | grep -q .; then
            echo "XCFramework must not carry headers: CocoaPods stages them a second time" >&2
            exit 1
          fi
          test -f "$RUNNER_TEMP/yhtua-vault-ios/include/module.modulemap"
          # Both simulator architectures must be present in the universal slice.
          lipo -info "$RUNNER_TEMP/yhtua-vault-ios/YhtuaMobile.xcframework"/ios-arm64_x86_64-simulator/libyhtua_mobile.a \
            | grep -q 'arm64' 
          lipo -info "$RUNNER_TEMP/yhtua-vault-ios/YhtuaMobile.xcframework"/ios-arm64_x86_64-simulator/libyhtua_mobile.a \
            | grep -q 'x86_64'
      - name: Compile an iOS-simulator consumer against the packaged unit
        run: |
          xcrun -sdk iphonesimulator swiftc -typecheck \
            -target arm64-apple-ios15.1-simulator \
            "$RUNNER_TEMP/yhtua-vault-ios/bindings/yhtua_mobile.swift" \
            bridge/ios/ConsumerCheck/consumer.swift \
            -I "$RUNNER_TEMP/yhtua-vault-ios/include"
      # Everything in the module except YhtuaVaultModule.swift is plain
      # Foundation/UIKit/Security, so it can be typechecked here without an
      # Xcode project. Cheap enough to run on every bridge push, and it is
      # what catches a Keychain, pasteboard or lifecycle mistake minutes
      # after the commit instead of at the next EAS build.
      - name: Typecheck the module's non-Expo Swift against the iOS SDK
        run: |
          xcrun -sdk iphonesimulator swiftc -typecheck \
            -target arm64-apple-ios15.1-simulator \
            "$RUNNER_TEMP/yhtua-vault-ios/bindings/yhtua_mobile.swift" \
            apps/mobile/modules/yhtua-vault/ios/KeyStore.swift \
            apps/mobile/modules/yhtua-vault/ios/SelfTest.swift \
            apps/mobile/modules/yhtua-vault/ios/SensitiveClipboard.swift \
            apps/mobile/modules/yhtua-vault/ios/PrivacyCover.swift \
            -I "$RUNNER_TEMP/yhtua-vault-ios/include"
      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: YhtuaMobile.xcframework
          path: ${{ runner.temp }}/yhtua-vault-ios/YhtuaMobile.xcframework
          if-no-files-found: error

  app:
    name: iOS app compiles (Expo module included)
    # Not macos-14 (Xcode 15.4: React Native 0.86 refuses to generate a
    # Podfile) and not macos-15 (Xcode 16.4 ships Swift 6.1, while an SPM
    # dependency in the Expo tree declares tools version 6.2).
    runs-on: macos-26
    # The one gate that compiles YhtuaVaultModule.swift: it needs
    # ExpoModulesCore, which only exists inside a real prebuilt Xcode
    # workspace. Without this the Expo module's Swift first compiles on an
    # EAS builder, minutes of queue after the mistake was made.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Printed unconditionally: when the image's toolchain drifts out from
      # under the React Native / Expo requirements again, the first line of
      # the log says which versions were actually available.
      - name: Report the available Xcode toolchains
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          swift --version
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Set up Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
      # The same hook EAS runs, so a break here is a break there.
      - name: Build the vendored Rust XCFramework
        run: bash scripts/eas-pre-install.sh
      - name: Generate the iOS project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build for the simulator
        working-directory: apps/mobile/ios
        run: |
          # xcodebuild's useful output is thousands of lines before the error,
          # so the log goes to a file and only the diagnostics are printed.
          set +e
          xcodebuild build \
            -workspace Yhtua.xcworkspace \
            -scheme Yhtua \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Compiler diagnostics"
            grep -E "error:|error generated|\*\* BUILD FAILED" "$RUNNER_TEMP/xcodebuild.log" | head -60
            echo "::endgroup::"
          fi
          exit "$status"
      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
      # Compiling proves the module type-checks; it does not prove the app
      # survives launch. An Expo module that fails to register, a missing
      # native symbol, or a crash in the privacy cover's OnCreate all compile
      # perfectly and then kill the app on the first frame — which is exactly
      # how the Android build broke earlier in this project.
      - name: Launch the app on a simulator
        run: |
          set -euo pipefail
          # Chosen from what the image actually has, not hard-coded: the
          # Xcode version on this runner has already moved twice.
          devicetype=$(xcrun simctl list devicetypes \
            | grep -o 'com.apple.CoreSimulator.SimDeviceType.iPhone-[0-9A-Za-z-]*' | tail -1)
          runtime=$(xcrun simctl list runtimes \
            | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | tail -1)
          echo "simulator: $devicetype on $runtime"
          device=$(xcrun simctl create yhtua-ci "$devicetype" "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b

          app=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" \
            -maxdepth 1 -name 'Yhtua.app' | head -1)
          test -n "$app"
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" fr.gendrey.yhtua

          # A crash is not instant: the JS bundle loads, the lock host starts,
          # the vault module registers. Give it a beat, then insist it is
          # still alive and left no crash report behind.
          sleep 20
          if ! xcrun simctl spawn "$device" launchctl list | grep -q fr.gendrey.yhtua; then
            echo "The app is no longer running after launch" >&2
            find ~/Library/Logs/DiagnosticReports -name 'Yhtua*' -exec cat {} \; | head -80
            exit 1
          fi
          if find ~/Library/Logs/DiagnosticReports -name 'Yhtua*' | grep -q .; then
            echo "The app produced a crash report" >&2
            find ~/Library/Logs/DiagnosticReports -name 'Yhtua*' -exec cat {} \; | head -80
            exit 1
          fi
          echo "Yhtua launched and stayed running on the simulator"
